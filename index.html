<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortnite Clone - Battle Royale (WASM)</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial; }
    #ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; color:#fff; }
    .chr { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
    .chr-h,.chr-v { position:absolute; background:rgba(255,255,255,0.85); box-shadow:0 0 6px #000; }
    .chr-h { width:16px; height:2px; top:50%; left:50%; margin-left:-8px; margin-top:-1px; }
    .chr-v { width:2px; height:16px; top:50%; left:50%; margin-left:-1px; margin-top:-8px; }
    .chr-d { width:3px; height:3px; background:#f44; border-radius:50%; position:absolute; top:50%; left:50%; margin-left:-1.5px; margin-top:-1.5px; }
    #btm-l { position:absolute; bottom:20px; left:20px; display:flex; flex-direction:column; gap:5px; }
    .bp { display:flex; align-items:center; gap:8px; }
    .bl { width:20px; height:20px; font-size:11px; font-weight:bold; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); border-radius:4px; }
    .bo { width:180px; height:14px; background:rgba(0,0,0,0.6); border-radius:7px; overflow:hidden; position:relative; border:1px solid rgba(255,255,255,0.2); }
    .bi { height:100%; border-radius:7px; transition:width 0.15s; }
    .bi.hp { background:linear-gradient(180deg,#5f5,#1a1); }
    .bi.sh { background:linear-gradient(180deg,#5af,#15a); }
    .bn { position:absolute; width:100%; text-align:center; line-height:14px; font-size:10px; font-weight:bold; text-shadow:0 0 4px #000; }
    #rt-p { position:absolute; bottom:20px; right:20px; text-align:right; background:rgba(0,0,0,0.55); padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); }
    #wn { font-size:17px; font-weight:bold; }
    #am { font-size:28px; font-weight:bold; color:#ffd; }
    .rs { margin-top:6px; display:flex; gap:10px; font-size:13px; }
    .ri { display:flex; align-items:center; gap:4px; }
    .ric { width:16px; height:16px; border-radius:3px; display:inline-block; }
    .ric.wd { background:linear-gradient(135deg,#8B6914,#C49A3C,#5C3D0E); border:1px solid #3d2200; }
    .ric.st { background:linear-gradient(135deg,#7a7a7a,#a8a8a8,#4a4a4a); border:1px solid #333; }
    .ric.mt { background:linear-gradient(135deg,#5a6a7a,#8a9aAA,#3a4a5a); border:1px solid #2a3a4a; }
    #mmw { position:absolute; top:20px; right:20px; width:170px; height:170px; border-radius:50%; overflow:hidden; border:3px solid rgba(255,255,255,0.5); background:#1a1a2e; }
    #mm { width:100%; height:100%; }
    #msg { position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); font-size:38px; font-weight:bold; text-align:center; opacity:0; transition:opacity 0.4s; text-shadow:0 0 15px #000; }
    #bld-ind { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:36px; height:36px; border:2px dashed rgba(100,200,255,0.7); border-radius:4px; background:rgba(100,150,255,0.12); }
    #ctrl { position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:10px; color:rgba(255,255,255,0.55); background:rgba(0,0,0,0.5); padding:4px 12px; border-radius:10px; }
  </style>
</head>
<body>
<div id="ui">
  <div class="chr"><div class="chr-h"></div><div class="chr-v"></div><div class="chr-d"></div></div>
  <div id="btm-l">
    <div class="bp"><div class="bl" style="color:#5f5;">HP</div><div class="bo"><div class="bn" id="hpt">100</div><div class="bi hp" id="hpf" style="width:100%"></div></div></div>
    <div class="bp"><div class="bl" style="color:#5af;">SH</div><div class="bo"><div class="bn" id="sht">100</div><div class="bi sh" id="shf" style="width:100%"></div></div></div>
  </div>
  <div id="rt-p">
    <div id="wn">Pickaxe</div><div id="am">30</div>
    <div class="rs">
      <div class="ri"><span class="ric wd"></span><span id="wd">200</span></div>
      <div class="ri"><span class="ric st"></span><span id="sn">150</span></div>
      <div class="ri"><span class="ric mt"></span><span id="ml">100</span></div>
    </div>
  </div>
  <div id="mmw"><canvas id="mm" width="170" height="170"></canvas></div>
  <div id="msg"></div>
  <div id="bld-ind"></div>
  <div id="ctrl">WASD Move | Mouse Look | LMB Shoot | RMB Build | Q Build Mode | 1/2/3 Piece | R Switch Weapon</div>
</div>

<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>

<script type="module">
  import * as THREE from 'three';

  // ===== Load WASM =====
  const response = await fetch('game.wasm');
  const wasmModule = await WebAssembly.instantiateStreaming(response, {});
  const wasm = wasmModule.instance.exports;

  // ===== Three.js Setup =====
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 100, 400);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.5, 500);
  camera.position.set(0, 200, 50);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x405070);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
  sun.position.set(100, 200, 60);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 500;
  sun.shadow.camera.left = -150;
  sun.shadow.camera.right = 150;
  sun.shadow.camera.top = 150;
  sun.shadow.camera.bottom = -150;
  scene.add(sun);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(300, 300);
  const groundMat = new THREE.MeshLambertian({ color: 0x3a6b1e });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.1;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid lines for reference
  const gridHelper = new THREE.GridHelper(300, 60, 0x335522, 0x224418);
  gridHelper.position.y = 0;
  scene.add(gridHelper);

  // Player meshes
  const playerMeshes = [];
  const playerMaterials = [];
  for (let i = 0; i < 16; i++) {
    const isPlayer = i === 0;
    const geo = new THREE.BoxGeometry(0.7, 1.8, 0.7);
    const mat = new THREE.MeshLambertian({ color: isPlayer ? 0xffaa00 : 0xdd3333 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.visible = false;
    scene.add(mesh);

    // Head
    const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
    const headMat = new THREE.MeshLambertian({ color: isPlayer ? 0xffcc66 : 0xff6666 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.15;
    head.castShadow = true;
    mesh.add(head);

    // Gun
    const gunGeo = new THREE.BoxGeometry(0.12, 0.12, 0.7);
    const gunMat = new THREE.MeshLambertian({ color: 0x333333 });
    const gun = new THREE.Mesh(gunGeo, gunMat);
    gun.position.set(0.4, 0.4, 0.3);
    gun.castShadow = true;
    mesh.add(gun);

    playerMeshes.push(mesh);
    playerMaterials.push(mat);
  }

  // Structure meshes cache
  const structureGroup = new THREE.Group();
  scene.add(structureGroup);
  const structureMeshes = new Map();

  // Chest meshes
  const chestMeshes = [];
  const chestGeo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
  const chestMat = new THREE.MeshLambertian({ color: 0xd4a840 });
  const chestGoldMat = new THREE.MeshLambertian({ color: 0x888888 });
  for (let i = 0; i < 20; i++) {
    const chest = new THREE.Mesh(chestGeo, chestMat);
    chest.castShadow = true;
    chest.receiveShadow = true;
    chest.visible = false;
    scene.add(chest);
    chestMeshes.push(chest);
  }

  // Storm cylinder
  const stormGeo = new THREE.CylinderGeometry(200, 200, 400, 64);
  const stormMat = new THREE.MeshBasicMaterial({
    color: 0x9944ff,
    transparent: true,
    opacity: 0.25,
    side: THREE.DoubleSide
  });
  const stormMesh = new THREE.Mesh(stormGeo, stormMat);
  stormMesh.position.y = 200;
  scene.add(stormMesh);

  // ===== Input State =====
  const inputState = {
    forward: 0, backward: 0, left: 0, right: 0,
    jump: 0, shoot: 0, build: 0, switchWeapon: 0,
    mouseDx: 0, mouseDy: 0, buildPiece: 0
  };

  document.addEventListener('keydown', e => {
    switch(e.code) {
      case 'KeyW': inputState.forward = 1; break;
      case 'KeyS': inputState.backward = 1; break;
      case 'KeyA': inputState.left = 1; break;
      case 'KeyD': inputState.right = 1; break;
      case 'Space': inputState.jump = 1; e.preventDefault(); break;
      case 'KeyR': inputState.switchWeapon = 1; break;
      case 'Digit1': inputState.buildPiece = 0; break;
      case 'Digit2': inputState.buildPiece = 1; break;
      case 'Digit3': inputState.buildPiece = 2; break;
    }
  });
  document.addEventListener('keyup', e => {
    switch(e.code) {
      case 'KeyW': inputState.forward = 0; break;
      case 'KeyS': inputState.backward = 0; break;
      case 'KeyA': inputState.left = 0; break;
      case 'KeyD': inputState.right = 0; break;
      case 'Space': inputState.jump = 0; break;
      case 'KeyR': inputState.switchWeapon = 0; break;
    }
  });

  document.addEventListener('mousedown', e => {
    if (e.button === 0) inputState.shoot = 1;
    if (e.button === 2) { inputState.build = 1; e.preventDefault(); }
  });
  document.addEventListener('mouseup', e => {
    if (e.button === 0) inputState.shoot = 0;
    if (e.button === 2) { inputState.build = 0; e.preventDefault(); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement) {
      inputState.mouseDx += e.movementX * 0.003;
      inputState.mouseDy += e.movementY * 0.003;
    }
  });
  document.body.addEventListener('click', () => {
    if (!document.pointerLockElement) document.body.requestPointerLock();
  });

  // ===== Initialize Game =====
  wasm.initGame();

  // ===== UI Elements =====
  const uiHpText = document.getElementById('hpt');
  const uiHpFill = document.getElementById('hpf');
  const uiShText = document.getElementById('sht');
  const uiShFill = document.getElementById('shf');
  const uiWeaponName = document.getElementById('wn');
  const uiAmmo = document.getElementById('am');
  const uiWood = document.getElementById('wd');
  const uiStone = document.getElementById('sn');
  const uiMetal = document.getElementById('ml');
  const uiMsg = document.getElementById('msg');
  const uiBuildInd = document.getElementById('bld-ind');
  const mmCanvas = document.getElementById('mm');
  const mmCtx = mmCanvas.getContext('2d');

  const weaponNames = ['Pickaxe', 'Assault Rifle', 'Shotgun'];

  function showMessage(text, duration = 2000) {
    uiMsg.textContent = text;
    uiMsg.style.opacity = '1';
    setTimeout(() => { uiMsg.style.opacity = '0'; }, duration);
  }

  // ===== Structure Mesh Management =====
  function updateStructureMeshes() {
    const dim = wasm.getGridDim();
    // Simple approach: rebuild all visible structures each frame
    // For performance with WASM, we batch this
    structureGroup.clear();
    structureMeshes.clear();

    const wallGeo = new THREE.BoxGeometry(2, 3, 2);
    const floorGeo = new THREE.BoxGeometry(2, 0.3, 2);
    const rampGeo = new THREE.ConeGeometry(1.2, 2, 4);

    const matWall = new THREE.MeshLambertian({ color: 0x8B7355 });
    const matFloor = new THREE.MeshLambertian({ color: 0x9B8B75 });
    const matRamp = new THREE.MeshLambertian({ color: 0x6B5B45 });

    const halfMap = 150;
    for (let iz = 0; iz < dim; iz++) {
      for (let ix = 0; ix < dim; ix++) {
        const tile = wasm.getGridTile(ix, iz);
        if (tile === 0) continue;

        const x = (ix + 0.5) * 2 - halfMap;
        const z = (iz + 0.5) * 2 - halfMap;
        let mesh;

        if (tile === 1) {
          mesh = new THREE.Mesh(wallGeo, matWall);
        } else if (tile === 2) {
          const m = new THREE.Mesh(floorGeo, matFloor);
          m.position.y = 0.15;
          mesh = m;
        } else {
          const m = new THREE.Mesh(rampGeo, matRamp);
          m.position.y = 0.5;
          mesh = m;
        }

        if (tile !== 2) mesh.position.y = 1.5;
        mesh.position.x = x;
        mesh.position.z = z;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        structureGroup.add(mesh);
        structureMeshes.set(`${ix},${iz}`, mesh);
      }
    }
  }

  // ===== Game Loop =====
  let prevTime = performance.now();
  let structureUpdateCounter = 0;

  function gameLoop() {
    requestAnimationFrame(gameLoop);

    const now = performance.now();
    const dt = Math.min((now - prevTime) / 1000, 0.1);
    prevTime = now;

    // Send input to WASM
    wasm.setInput(
      inputState.forward, inputState.backward, inputState.left, inputState.right,
      inputState.jump, inputState.shoot, inputState.build, inputState.switchWeapon,
      inputState.mouseDx, inputState.mouseDy, inputState.buildPiece
    );
    inputState.mouseDx = 0;
    inputState.mouseDy = 0;

    // Reset single-frame inputs
    inputState.shoot = 0;
    inputState.build = 0;
    inputState.switchWeapon = 0;

    // Update game
    wasm.update(dt);

    // Update player positions
    const numPlayers = wasm.getNumPlayers();
    for (let i = 0; i < numPlayers; i++) {
      const mesh = playerMeshes[i];
      if (!mesh) continue;
      const alive = wasm.getPlayerAlive(i);
      mesh.visible = alive === 1;
      if (alive) {
        mesh.position.set(wasm.getPlayerX(i), wasm.getPlayerY(i), wasm.getPlayerZ(i));
        mesh.rotation.y = wasm.getPlayerYaw(i);
      }
    }

    // Update chests
    for (let i = 0; i < 20; i++) {
      const chest = chestMeshes[i];
      const opened = wasm.getChestOpened(i);
      chest.visible = opened === 0;
      if (!opened) {
        chest.position.set(wasm.getChestX(i), 0.3, wasm.getChestZ(i));
        chest.material = chestMat;
      }
    }

    // Update structures periodically
    structureUpdateCounter++;
    if (structureUpdateCounter > 30) {
      updateStructureMeshes();
      structureUpdateCounter = 0;
    }

    // Update storm mesh
    const stormRadius = wasm.getStormRadius();
    stormMesh.scale.set(stormRadius / 200, 1, stormRadius / 200);

    // Camera follow player
    const px = wasm.getPlayerX(0);
    const py = wasm.getPlayerY(0);
    const pz = wasm.getPlayerZ(0);
    const pyaw = wasm.getPlayerYaw(0);
    const ppitch = wasm.getPlayerPitch(0);

    const camDist = 5;
    const camHeight = 2.5;
    const camX = px - Math.sin(pyaw) * camDist * Math.cos(ppitch);
    const camY = py + camHeight + Math.sin(ppitch) * camDist;
    const camZ = pz - Math.cos(pyaw) * camDist * Math.cos(ppitch);

    camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.2);
    camera.lookAt(px, py + 1.2, pz);

    // Update UI
    const hp = Math.max(0, Math.round(wasm.getPlayerHealth(0)));
    const sh = Math.max(0, Math.round(wasm.getPlayerShield(0)));
    uiHpText.textContent = hp;
    uiHpFill.style.width = hp + '%';
    uiShText.textContent = sh;
    uiShFill.style.width = sh + '%';

    const weapon = wasm.getPlayerWeapon(0);
    const ammo = wasm.getPlayerAmmo(0);
    uiWeaponName.textContent = weaponNames[weapon] || 'Pickaxe';
    uiAmmo.textContent = weapon === 0 ? '--' : ammo;
    uiWood.textContent = wasm.getPlayerWood(0);
    uiStone.textContent = wasm.getPlayerStone(0);
    uiMetal.textContent = wasm.getPlayerMetal(0);

    // Build indicator
    const buildMode = inputState.buildPiece !== undefined;
    uiBuildInd.style.display = buildMode ? 'block' : 'none';

    // Check win/lose
    if (wasm.getPlayerAlive(0) === 0) {
      showMessage('ELIMINATED', 999999);
    } else if (wasm.getAliveCount() <= 1) {
      showMessage('VICTORY ROYALE!', 999999);
    }

    // Update minimap
    mmCtx.clearRect(0, 0, 170, 170);
    // Background
    mmCtx.fillStyle = '#1a1a2e';
    mmCtx.beginPath();
    mmCtx.arc(85, 85, 83, 0, Math.PI * 2);
    mmCtx.fill();

    // Storm circle
    mmCtx.strokeStyle = '#9944ff';
    mmCtx.lineWidth = 2;
    mmCtx.beginPath();
    mmCtx.arc(85, 85, (stormRadius / 200) * 80, 0, Math.PI * 2);
    mmCtx.stroke();

    // Players on minimap
    for (let i = 0; i < numPlayers; i++) {
      if (!wasm.getPlayerAlive(i)) continue;
      const mx = (wasm.getPlayerX(i) / 150) * 80 + 85;
      const mz = (wasm.getPlayerZ(i) / 150) * 80 + 85;
      mmCtx.fillStyle = i === 0 ? '#ffaa00' : '#ff4444';
      mmCtx.beginPath();
      mmCtx.arc(mx, mz, i === 0 ? 3 : 2, 0, Math.PI * 2);
      mmCtx.fill();
    }

    renderer.render(scene, camera);
  }

  // Initial structure build
  updateStructureMeshes();
  showMessage('DROP FROM THE BATTLE BUS!', 3000);

  // Start
  gameLoop();

  // Resize handler
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
