<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Royale</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --gold:#f5c518;--blue:#1a9fff;--red:#ff3a3a;--green:#3aff80;
            --storm:#2244ff;--dark:#0a0e1a;--wood:#c8a068;--stone:#aaa;--metal:#8ab0d0;
        }
        html,body{width:100%;height:100%;overflow:hidden;background:#000;
            font-family:'Barlow Condensed',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
        #game-canvas{display:none;position:absolute;inset:0;width:100vw;height:100vh;cursor:crosshair}
        /* ---------- LOBBY ---------- */
        #lobby{
            position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
            justify-content:center;z-index:1000;background:linear-gradient(160deg,#050a14,#0d2040,#081a0a)
        }
        #lobby-canvas{width:260px;height:340px;border-radius:20px;box-shadow:0 0 40px rgba(245,197,24,0.4);margin-bottom:20px}
        .lobby-title{font-size:42px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
            background:linear-gradient(180deg,#fff 0%,var(--gold) 55%,#d48a00 100%);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
        .lobby-sub{font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:6px;margin-bottom:28px}
        #name-input{
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#fff;
            font-family:inherit;font-size:20px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
            padding:12px 20px;width:260px;text-align:center;margin-bottom:20px;
            clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);outline:none
        }
        #name-input:focus{border-color:var(--gold)}
        #play-btn{
            background:linear-gradient(180deg,#f5c518 0%,#c48800 100%);
            color:#000;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;
            letter-spacing:5px;text-transform:uppercase;border:none;cursor:pointer;padding:14px 60px;
            clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
            transition:transform .1s,filter .1s
        }
        #play-btn:hover{transform:scale(1.04);filter:brightness(1.1)}
        #play-btn:active{transform:scale(0.98)}
        /* ---------- HUD (hidden until game) ---------- */
        #hud{position:fixed;inset:0;pointer-events:none;z-index:100;display:none}
        /* Crosshair */
        #crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0}
        .ch-arm{position:absolute;background:rgba(255,255,255,0.9);border-radius:1px}
        .ch-top{width:2px;height:8px;top:-14px;left:-1px}
        .ch-bot{width:2px;height:8px;top:6px;left:-1px}
        .ch-lft{width:8px;height:2px;top:-1px;left:-14px}
        .ch-rgt{width:8px;height:2px;top:-1px;left:6px}
        .ch-dot{width:3px;height:3px;background:rgba(255,255,255,0.9);border-radius:50%;position:absolute;top:-1.5px;left:-1.5px}
        /* Player count */
        #player-count-box{position:absolute;top:14px;left:50%;transform:translateX(-50%);
            background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);padding:8px 22px;display:flex;
            align-items:center;gap:10px;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
            border:1px solid rgba(255,255,255,0.12)}
        .pc-icon{width:18px;height:20px;position:relative;flex-shrink:0}
        .pc-icon::before{content:'';position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;left:4px;top:0}
        .pc-icon::after{content:'';position:absolute;width:14px;height:9px;background:#fff;border-radius:4px 4px 0 0;left:2px;top:11px}
        #player-count{font-size:30px;font-weight:800;line-height:1;color:#fff}
        #player-count-label{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;align-self:flex-end;margin-bottom:2px}
        /* Storm timer */
        #storm-timer-box{position:absolute;top:62px;left:50%;transform:translateX(-50%);text-align:center}
        #storm-timer{font-size:13px;color:rgba(200,220,255,0.75);letter-spacing:2px;text-transform:uppercase}
        /* Minimap */
        #minimap-wrap{position:absolute;top:14px;right:14px;border-radius:50%;overflow:hidden;
            box-shadow:0 0 0 2px rgba(255,255,255,0.25),0 4px 24px rgba(0,0,0,0.7)}
        #minimap-canvas{display:block;width:144px;height:144px}
        /* Kill feed */
        #killfeed{position:absolute;top:175px;right:14px;display:flex;flex-direction:column;gap:5px;min-width:220px}
        .kf-item{font-size:13px;padding:4px 10px;background:rgba(0,0,0,0.65);letter-spacing:.5px;animation:kfin .15s ease-out;white-space:nowrap}
        @keyframes kfin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
        .kf-kill{color:#ff9999;border-left:3px solid #ff4444}
        .kf-storm{color:#aaaaff;border-left:3px solid var(--storm)}
        /* Health / Shield */
        #health-shield-box{position:absolute;bottom:104px;left:36px;width:290px}
        .bar-group{margin-bottom:7px}
        .bar-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
        .bar-type{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5)}
        .bar-val{font-size:20px;font-weight:700;line-height:1}
        .bar-bg{width:100%;height:12px;background:rgba(255,255,255,0.1);position:relative;overflow:hidden;
            clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
        .bar-fill{height:100%;transition:width .15s ease-out;position:relative}
        .bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.25) 0%,transparent 60%)}
        #health-fill{background:linear-gradient(90deg,#c20,#f54);width:100%}
        #shield-fill{background:linear-gradient(90deg,#05c,#4af);width:100%}
        /* Inventory */
        #inventory-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
        .slot{width:74px;height:84px;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.18);
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
            position:relative;transition:border-color .1s,background .1s;
            clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%)}
        .slot.active{border-color:var(--gold);background:rgba(245,197,24,0.14)}
        .slot.active .slot-num{color:var(--gold)}
        .slot-num{position:absolute;top:4px;left:7px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.35);line-height:1}
        .slot-icon{width:38px;height:26px;position:relative;flex-shrink:0}
        .slot-name{font-size:9px;letter-spacing:.5px;color:rgba(255,255,255,0.65);text-align:center;text-transform:uppercase;line-height:1.15;padding:0 4px;min-height:20px}
        /* Weapon icons */
        .icon-pickaxe::before{content:'';position:absolute;width:4px;height:24px;background:#aaa;left:calc(50% - 2px);top:1px;transform:rotate(25deg);border-radius:2px}
        .icon-pickaxe::after{content:'';position:absolute;width:20px;height:7px;background:#ccc;left:7px;top:1px;clip-path:polygon(0 50%,25% 0%,100% 0%,100% 100%,25% 100%);border-radius:1px}
        .icon-ar::before{content:'';position:absolute;width:36px;height:7px;background:#999;top:10px;left:1px;border-radius:0 2px 2px 0}
        .icon-ar::after{content:'';position:absolute;width:14px;height:7px;background:#bbb;top:3px;left:7px;border-radius:1px}
        .icon-shotgun::before{content:'';position:absolute;width:28px;height:10px;background:#999;top:8px;left:4px;border-radius:2px}
        .icon-shotgun::after{content:'';position:absolute;width:10px;height:9px;background:#777;top:9px;left:4px;border-radius:1px}
        .icon-smg::before{content:'';position:absolute;width:28px;height:7px;background:#999;top:10px;left:4px;border-radius:0 2px 2px 0}
        .icon-smg::after{content:'';position:absolute;width:9px;height:6px;background:#bbb;top:4px;left:8px;border-radius:1px}
        .icon-sniper::before{content:'';position:absolute;width:38px;height:5px;background:#999;top:11px;left:0;border-radius:0 3px 3px 0}
        .icon-sniper::after{content:'';position:absolute;width:6px;height:5px;background:#bbb;top:6px;left:16px;border-radius:2px 2px 0 0}
        /* Ammo */
        #ammo-box{position:absolute;bottom:108px;right:36px;text-align:right;display:flex;align-items:baseline;gap:4px;justify-content:flex-end}
        #ammo-current{font-size:54px;font-weight:800;line-height:1;letter-spacing:-1px}
        #ammo-sep{font-size:26px;font-weight:400;color:rgba(255,255,255,0.35)}
        #ammo-reserve{font-size:28px;font-weight:600;color:rgba(255,255,255,0.5)}
        /* Materials */
        #materials-box{position:absolute;bottom:20px;right:36px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
        .mat-row{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
        .mat-icon{width:14px;height:14px;display:inline-block;border-radius:2px;flex-shrink:0}
        .mat-wood-icon{background:var(--wood)}
        .mat-stone-icon{background:var(--stone)}
        .mat-metal-icon{background:var(--metal)}
        .mat-count{min-width:38px;text-align:right;font-size:18px}
        .mat-label{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;min-width:44px;text-align:right}
        /* Build mode */
        #build-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-110px);
            display:none;background:rgba(0,0,0,0.8);border:1px solid rgba(0,200,255,0.4);padding:12px 26px;text-align:center;min-width:180px}
        #build-type-name{font-size:22px;font-weight:700;color:#0df;letter-spacing:3px;text-transform:uppercase}
        #build-mat-name{font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:2px;margin-top:3px;text-transform:uppercase}
        .build-hint-text{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;margin-top:7px;text-transform:uppercase}
        /* Other overlays */
        #damage-flash{position:absolute;inset:0;background:rgba(200,0,0,0.28);opacity:0;transition:opacity .18s;pointer-events:none}
        #notification{position:absolute;top:38%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .4s;pointer-events:none}
        #kill-counter{position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.6);padding:8px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);border:1px solid rgba(255,255,255,0.1)}
        .kc-skull{width:16px;height:16px;display:inline-block;background:rgba(255,255,255,0.8);border-radius:50% 50% 40% 40%;position:relative;vertical-align:middle;margin-right:6px}
        .kc-skull::after{content:'';position:absolute;width:8px;height:4px;background:rgba(0,0,0,0.7);border-radius:0 0 4px 4px;bottom:-2px;left:4px}
        #kill-count-val{font-size:22px;font-weight:700;vertical-align:middle}
    </style>
</head>
<body>

<div id="lobby">
    <canvas id="lobby-canvas"></canvas>
    <div class="lobby-title">Battle Royale</div>
    <div class="lobby-sub">LAST ONE STANDING</div>
    <input id="name-input" type="text" maxlength="14" placeholder="YOUR NAME" value="PLAYER">
    <button id="play-btn">DROP NOW</button>
</div>

<canvas id="game-canvas"></canvas>

<div id="hud">
    <div id="crosshair"><div class="ch-arm ch-top"></div><div class="ch-arm ch-bot"></div><div class="ch-arm ch-lft"></div><div class="ch-arm ch-rgt"></div><div class="ch-dot"></div></div>
    <div id="player-count-box"><div class="pc-icon"></div><div id="player-count">100</div><div id="player-count-label">Alive</div></div>
    <div id="storm-timer-box"><div id="storm-timer">Safe Zone Active</div></div>
    <div id="kill-counter"><span class="kc-skull"></span><span id="kill-count-val">0</span></div>
    <div id="minimap-wrap"><canvas id="minimap-canvas" width="144" height="144"></canvas></div>
    <div id="killfeed"></div>
    <div id="health-shield-box">
        <div class="bar-group"><div class="bar-label-row"><span class="bar-type">Shield</span><span class="bar-val" id="shield-value">100</span></div><div class="bar-bg"><div class="bar-fill" id="shield-fill"></div></div></div>
        <div class="bar-group"><div class="bar-label-row"><span class="bar-type">Health</span><span class="bar-val" id="health-value">100</span></div><div class="bar-bg"><div class="bar-fill" id="health-fill"></div></div></div>
    </div>
    <div id="inventory-bar">
        <div class="slot active" id="slot-0"><div class="slot-num">1</div><div class="slot-icon icon-pickaxe"></div><div class="slot-name">Harvesting</div></div>
        <div class="slot" id="slot-1"><div class="slot-num">2</div><div class="slot-icon"></div><div class="slot-name"></div></div>
        <div class="slot" id="slot-2"><div class="slot-num">3</div><div class="slot-icon"></div><div class="slot-name"></div></div>
        <div class="slot" id="slot-3"><div class="slot-num">4</div><div class="slot-icon"></div><div class="slot-name"></div></div>
        <div class="slot" id="slot-4"><div class="slot-num">5</div><div class="slot-icon"></div><div class="slot-name"></div></div>
    </div>
    <div id="ammo-box"><span id="ammo-current">--</span><span id="ammo-sep">/</span><span id="ammo-reserve">--</span></div>
    <div id="materials-box">
        <div class="mat-row"><span class="mat-label">WOOD</span><span class="mat-icon mat-wood-icon"></span><span class="mat-count" id="mat-wood">200</span></div>
        <div class="mat-row"><span class="mat-label">STONE</span><span class="mat-icon mat-stone-icon"></span><span class="mat-count" id="mat-stone">150</span></div>
        <div class="mat-row"><span class="mat-label">METAL</span><span class="mat-icon mat-metal-icon"></span><span class="mat-count" id="mat-metal">75</span></div>
    </div>
    <div id="build-indicator"><div id="build-type-name">WALL</div><div id="build-mat-name">WOOD</div><div class="build-hint-text">LMB: Place &bull; G: Material &bull; Scroll: Type &bull; Q: Cancel</div></div>
    <div id="damage-flash"></div>
    <div id="notification"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="utils.js"></script>
<script src="weapons.js"></script>
<script src="building.js"></script>
<script src="player.js"></script>
<script src="enemy.js"></script>
<script src="ui.js"></script>
<script src="lobby.js"></script>
<script src="game.js"></script>

</body>
</html>
